# Spanish.

settings:
  primaryStressDiv: 1.25
  secondaryStressDiv: 1.07

  # Stop closure - use "always" for Spanish to ensure clear consonants
  # and prevent final taps from being swallowed (e.g. "abrir paréntesis").
  # Increased gaps for better consonant separation.
  stopClosureMode: always
  stopClosureVowelGapMs: 30
  stopClosureVowelFadeMs: 6
  stopClosureClusterGapMs: 30
  stopClosureClusterFadeMs: 5
  stopClosureWordBoundaryClusterGapMs: 36
  stopClosureWordBoundaryClusterFadeMs: 5
  stopClosureNasalToStopGapMs: 10
  stopClosureNasalToStopFadeMs: 2

  segmentBoundaryGapMs: 20
  segmentBoundaryFadeMs: 6

  # Diphthong offglide duration: default 20ms starves /ei/, /eu/ glides
  # ("rey", "rei", "reu" lose the final vowel).  30ms gives the formant
  # sweep time to settle at the offglide target.
  tiedFromVowelDurationMs: 30
  # Resist speed compression on diphthongs (0=none, 1=fully rate-invariant).
  diphthongRateCompensation: 0.3

  # Boundary smoothing disabled - we want crisp consonants
  boundarySmoothing:
    enabled: false

  # Trill modulation (rolled R). Applied only when the phoneme has _isTrill: true.
  trillModulationMs: 52
  trillModulationFadeMs: 2

  # Single-word utterance smoothing (key echo / word-by-word navigation)
  singleWordTuningEnabled: true
  singleWordFinalHoldMs: 35
  singleWordFinalFadeMs: 18
  singleWordClauseTypeOverride: "."
  singleWordClauseTypeOverrideCommaOnly: true

# Spanish pure vowels - monophthongs without English-style diphthongization.
# These override the base phonemes.yaml values for Spanish.
  spellingDiphthongMode: none
  stopClosureAfterNasalsEnabled: false
  segmentBoundarySkipVowelToLiquid: false
  postStopAspirationEnabled: false
  # 2026-08-21 (#108/#109): re-enabled.  This was switched off in the
  # January pack sweep, when getPlace() couldn't classify the _es
  # allophones and the pass fired inconsistently (bare keys only).
  # With the suffix-stripping fix in pass_common.h the locus machinery
  # works for d_es/ɣ_es/l_es etc.  Whisper-differential vs the ETI
  # reference engine confirmed the missing C→V F2 transitions were the
  # "duro"→"buro" and "regla"→"reula" percepts.
  coarticulationEnabled: true
  # Spanish needs deeper locus onsets than the 0.25 default: the ETI
  # reference opens "duro" with F2≈1530 gliding to the /u/ over ~60 ms,
  # while 0.25 strength only reaches ~850.  0.70 puts the dental onset
  # near 1200 (Celdrán locus-equation territory for d̪ before /u/).
  coarticulationStrength: 0.70
  # true (2026-08-21, #108): VC half — vowels ramp their END formants
  # toward the following consonant's locus (regla /eɣl/, amigo /iɣo/).
  coarticulationFadeIntoConsonants: true
  # Steady-state vowel rendering (#113): transition -> canonical vowel ->
  # transition, instead of one whole-vowel ramp that never lands (dos as
  # "dös").  Transition lengths anchored to Eloquence-lineage reference
  # measurements (~35 ms in, ~40 ms out on "dos" at default rate).
  coarticulationSteadyState: true
  coarticulationTransInMs: 35
  coarticulationTransOutMs: 40
  coarticulationVelarPinchEnabled: false
  coarticulationGraduated: false
  coarticulationAdjacencyMaxConsonants: 2
  phraseFinalLengtheningEnabled: false
  phraseFinalLengtheningNucleusOnlyMode: false
  microprosodyEnabled: false
  microprosodyVoicelessF0RaiseEnabled: false
  microprosodyVoicedF0LowerEnabled: false
  rateReductionEnabled: false
  nasalizationAnticipatoryEnabled: false
  liquidDynamics:
    enabled: false
  lengthContrast:
    enabled: false
  # Auto-tie vowel+semivowel pairs into diphthongs so collapse pass
  # gives them proper formant interpolation (fixes /ei/, /eu/ offglides).
  autoTieDiphthongs: true
  # Keep /ɪ_es/ as the offglide — don't replace with base /j/.
  # The ɪ→ɪ_es replacement gives Spanish-tuned formants; the default
  # offglide-to-semivowel swap bypasses that, producing a /j/ with
  # near-identical F2 to /e/, making the diphthong inaudible.
  autoDiphthongOffglideToSemivowel: false

  allophoneRulesEnabled: true
  allophoneRules:
    enabled: false
    glottalReinforcement:
      enabled: false
  trajectoryLimit:
    enabled: false
    applyAcrossWordBoundary: false
  legacyPitchMode: espeak_style

  thousandsSeparatorCommaToSpace: true

  dictSuffixes:
    - "mente" # adverb
    - "es"    # plural (after consonant)
    - "s"     # plural (after vowel)

normalization:
  classes:
    # Let's define vowels for further pronounciation exceptions.
    VOWELS:
      - a
      - e
      - i
      - o
      - u

    # This is needed to smoot wors like 'convencer', which are phonetically transcribed into /m/ and /b/ coda.
    # And soften /d/ (andar)
    NASAL:
      - m
      - n
    # Let's define stop consonants, to fix Espeak diphthong mistakes in Spanish.
    # Patria is transcribed phonetically to "pˈatɾia".
    STOPS:
      - "β"
      - "ð"
      - k
      - d
      - f
      - "ɣ"
      - p
      - t

  skipReplacements:
    # Spanish does not have a /t͡s/ affricate — "ts" sequences (e.g. whatsapp,
    # ibmtts) are separate /t/ + /s/ and the /s/ must remain free for
    # dialect-specific replacement (s→s_es or s→s_mx).
    - from: "ts"
      to: "t͡s"

  preReplacements:
    # eSpeak number expansion concatenates morphemes, creating geminate /ss/
    # at boundaries (e.g. "200" → "dossjentos" from dos+cientos with seseo).
    # Spanish has no geminate /ss/ — deduplicate before dialect s→s_es/s_mx.
    - from: "ss"
      to: "s"

    # Spanish consonant gemination (issue #91): Spanish speakers merge
    # orthographic double consonants into single sounds.  "innato",
    # "cannabis", "vegetto", "kakarotto", "Klatt" etc. should be pronounced
    # with single consonants.  eSpeak emits the doubles literally; merge here.
    #
    # Skipped intentionally:
    #   rr — phonemic trill contrast (pero/perro)
    #   ll — digraph, already converted to ʎ or ʝ by eSpeak
    #   ɲɲ — explicit doubling for mañana clarity (different Unicode)
    #   cc — usually /kθ/ or /ks/ (acción), not true gemination
    - from: "nn"
      to: "n"
    - from: "tt"
      to: "t"
    - from: "bb"
      to: "b"
    - from: "pp"
      to: "p"
    - from: "dd"
      to: "d"
    - from: "ff"
      to: "f"
    - from: "mm"
      to: "m"
    - from: "ɡɡ"
      to: "ɡ"
    - from: "kk"
      to: "k"

  replacements:
    # Pronounciation-level normalization rules:
    # Palatal nasal: some tables emit ñ as nʲ (or n͡ʲ). Map it to /ɲ/ so it doesn't collapse to plain /n/.
    - from: "n͡ʲ"
      to: "ɲ"
    - from: "nʲ"
      to: "ɲ"
    - from: "ɲʲ"
      to: "ɲ"
    # eSpeak Spanish often emits "ʝ" for initial <y>/<ll> (e.g. "yo").
    # We have a dedicated ʝ phoneme; keep it.
    # If a voice uses the affricate ɟʝ, collapse it to ʝ to avoid an overly "hard" onset.
    - from: "ɟʝ"
      to: "ʝ"
    # Specific replacements
    # Make ñ a bit longer, so "mañana" could sound a bit better, and can be distinguished from n.
    # Rate compensation isn't ideal, we'll need to lengthen it even on normal speed.
    - from: "ɲ"
      to: "ɲɲ"
    # Smoot /b/ to /β/ in the following cases: before m, and when it is located at the end to avoid strange glitches.
    - from: b
      to: "β"
      when:
        afterClass: NASAL
    - from: b
      to: "β"
      when:
        atWordEnd: true
    # Also smooting /d/ in words like 'velocidad':
    - from: d
      to: "ð"
      when:
        atWordEnd: true
    # G approximant. To improve clarity, let's convert into non-aproximant g at the start, example: muy grande.
    - from: "ɣ"
      to: "ɡ"
      when:
        atWordStart: true
    # Intervocalic tap: insert micro-schwa to give the tap room
    # between vowels (e.g. "para" → "paᵊɾa").
    # Requires vowel both before AND after — prevents nasal-like
    # murmur at word-final position ("trabajador" stays clean).
    - from: "ɾ"
      to: "ᵊɾ"
      when:
        afterClass: VOWELS
        beforeClass: VOWELS
    # Word-final tap for r: use ɾ_wf allophone which has fricationAmplitude
    # for a tongue-flick release and raised F2 to distinguish from /n/.
    # Without this, utterance-final taps sound nasal ("perdén", "amón").
    # Only trill when next word starts with a consonant or at end of phrase.
    # Before vowels ("buscar esto"), the tap links smoothly — no trill (#42).
    - from: "ɾ"
      to: "ɾ_wfᵊɾ_wf"
      when:
        atWordEnd: true
        nextWordStartsNotClass: VOWELS
    # ===== Espeak =====
    # Section 1: fix espeak's pronounciation mistakes like 'prueba', when 'u' is preceded by a stressed vowel. That always should be 'w', diphthong.
    - from: "uˈ"
      to: "wˈ"
      when:
        beforeClass: VOWELS
    # Section 2: i > j. 
    # stop + L, r, current replacement, then a vowel.
    # We can replace "amplia" (p+l = cluster, i>j = fixed diphthong, a = needed), but not "amplificar". After the "pl" cluster, there is not a diphthong, so we'll need to be careful here.
    # L: Amplia:
    - from: "li"
      to: "lj"
      when:
        afterClass: STOPS
        beforeClass: VOWELS
    - from: "lu"
      to: "lw"
      when:
        afterClass: STOPS
        beforeClass: VOWELS
    # r: Patria:
    - from: "ɾi"
      to: "ɾj"
      when:
        afterClass: STOPS
        beforeClass: VOWELS
    - from: "ɾu"
      to: "ɾw"
      when:
        afterClass: STOPS
        beforeClass: VOWELS
    # ===== End Espeak =====
    # Separate consonant clusters so they don't blend together.
    # Insert a micro-schwa to give each consonant space.
    # ɾ+approximant clusters (e.g. "verde" = ɾð, "largo" = ɾɣ)
    - from: "ɾð"
      to: "ɾᵊð"
    # /ɾɣ/ → /ɾᵊɡ/ (NOT /ɾᵊɣ/): plain /ɡ/'s 30 ms closure works after schwa,
    # while /ɡ_es/'s 8 ms is masked by surrounding voicing. See rationale on
    # the /lɣ/, /sɣ/ block below.
    - from: "ɾɣ"
      to: "ɾᵊɡ"
    - from: "ɾβ"
      to: "ɾᵊβ"
    - from: "ɾθ"
      to: "ɾᵊθ"
    - from: "ɾf"
      to: "ɾᵊf"
    - from: "ɾx"
      to: "ɾᵊx"
    - from: "ɾk"
      to: "ɾᵊk"
    - from: "ɾl"
      to: "ɾᵊl"
    - from: "ɾm"
      to: "ɾᵊm"
    - from: "ɾn"
      to: "ɾᵊn"
    - from: "ɾp"
      to: "ɾᵊp"
    - from: "ɾs"
      to: "ɾᵊs"
    # Todo: I don't know why this doesn't work. Proper r with micro schwa for words like "archivo"
    - from: "ɾt͡ʃ"
      to: "ɾᵊt͡ʃ"
    - from: "ɾt"
      to: "ɾᵊt"
    # Approximant/stop + ɾ clusters (e.g. "madre" = ðɾ, "abrir" = βɾ)
    - from: "bɾ"
      to: "bᵊɾ"
    - from: "βɾ"
      to: "βᵊɾ"
    - from: "ðɾ"
      to: "ðᵊɾ"
    - from: "fɾ"
      to: "fᵊɾ"
    - from: "ɡɾ"
      to: "ɡᵊɾ"
    # /ɣɾ/ → /ɡᵊɾ/ (NOT /ɣᵊɾ/): plain /ɡ/'s 30 ms closure works after the
    # schwa, while /ɡ_es/'s 8 ms is masked by surrounding voicing. See
    # rationale on the /lɣ/, /ɾɣ/, /sɣ/ block below.
    - from: "ɣɾ"
      to: "ɡᵊɾ"
    - from: "kɾ"
      to: "kᵊɾ"
    - from: "pɾ"
      to: "pᵊɾ"
    - from: "dɾ"
      to: "dᵊɾ"
    - from: "tɾ"
      to: "tᵊɾ"
    # Separate sonorant/fricative + velar clusters so the preceding
    # consonant isn't swallowed by the velar burst.
    # Reported: "algo", "carga", "rasgar", "regla" sound unclear.
    # MUST come before dialect replacements (ɣ→ɣ_es, l→l_es, s→s_es)
    # or cascade protection makes the patterns unmatchable.
    #
    # NOTE on /ɣ/ collapsing to /ɡ/ in these splits: after the dialect
    # routing change to /ɣ/→/ɡ_es/ (closureGapMs: 8), an /ᵊ/ + /ɡ_es/
    # combo sounds like an approximant /ð/ — the schwa's voicing masks
    # the brief 8 ms closure (algo → "al-dho", largo → "lar-do"). Plain
    # /ɡ/'s 30 ms Spanish default closure is enough silence after the
    # schwa to read as a true stop.
    - from: "lɡ"
      to: "lᵊɡ"
    # 2026-05-01: was lɣ→lᵊɡ. Tomi ear-test caught regla/salga sounding
    # too-hard ("americanized G") vs eSpeak's softer fricative. The original
    # /ɡ/ routing was justified when /ɣ_es/ was a silent approximant
    # (fric=0.14) — schwa masked it. With /ɣ_es/ retuned as a salient
    # fricative (fric=0.45), schwa+fricative noise should provide its own
    # perceptual boundary. Mirrors the precedent set by /sɣ/ on 2026-04-26.
    - from: "lɣ"
      to: "lᵊɣ_cls"   # b8: tight cluster event; schwa KEPT — without it the F2 jump reads as a tap ("algro")
    - from: "ɾɡ"
      to: "ɾᵊɡ"
    # Note: ɾɣ handled above (line ~228, also collapses to /ɡ/).
    - from: "sɡ"
      to: "sᵊɡ"
    # /sɣ/ — Tomi's ear 2026-04-26 caught the prior "sᵊɡ" rule producing
    # too-hard "as-go" separation in "hasgo" vs eSpeak's smooth "asgo".
    # Letting /ɣ/ pass through to the dialect replacement (→ ɣ_es) keeps
    # the velar approximant continuous, matching the eSpeak es-mx output
    # /ˈasɣo/ which Mario/Greg's testers heard as natural.
    # (Was: sɣ → sᵊɡ.)
    # 2026-05-01: was ɣl→ɡᵊl. Same Tomi ear-test cycle as lɣ above caught
    # regla too-hard. Original "Spanish /ɡ/ stays a stop before liquids"
    # claim was based on Mateo's tuning intent + the silent-/ɣ_es/ era;
    # in fluent Spanish, pre-liquid velars CAN spirantize ([ˈreɣla]). With
    # /ɣ_es/ now salient-fricative, the schwa+fricative path matches
    # eSpeak's natural realization.
    - from: "ɣl"
      to: "ɣ_clsl"    # b8: tight cluster event, schwa dropped (whisper A/B: iglesia 0.29→1.00, arreglado →1.00)
    - from: "ɡl"
      to: "ɡᵊl"
    # Velar approximant + palatal glide coalescence.  In natural Spanish,
    # intervocalic /ɣ/ before /j/ merges into [ʝ] — two segments become
    # one gesture.  Synthesizing them as separate phonemes creates an F2
    # sweep through tap territory (~1450→2200 Hz), causing /r/-like percept
    # (issue #81: "siguiente" → "siriente").  [siˈʝente] is standard.
    # Note: ɣ before /i/ (cieguito) uses ɣ_es — no coalescence needed,
    # the boosted ɣ_es (cf2 1450, pf2 1400) handles that context fine.
    - from: "ɣj"
      to: "ʝ"
    # Custom phoneme tune replacements.
    # Make vowels more central:
    - from: a
      to: a_es
    # Openned e. It is already tuned in phonemes.yaml.
    # Todo: a way to consider a kind of sorted replacements. We replace e to e_es, but now ɛ to e.
    - from: "ɛ"
      to: e
    # Regular e:
    - from: e
      to: e_es
    - from: o
      to: o_es
    - from: u
      to: u_es
    # Spanish dental approximant - much less frication than English "the".
    - from: "ð"
      to: "ð_es"
    # A slightly softened and less noisy /d/.
    - from: d
      to: d_es
    # Spanish velar fricative [ɣ] — intervocalic lenited realization.
    # 2026-05-01: reverted from b201's /ɡ_es/ stop routing back to /ɣ_es/
    # after Tomi ear-tested vs eSpeak and confirmed eSpeak does the buzzy
    # roof-of-mouth fricative (canonical Spanish lenition per Hualde et al.,
    # Martínez-Celdrán & Mackenzie). The /ɡ_es/ stop routing was
    # hyperarticulated for native ears. The current /ɣ_es/ phoneme has been
    # retuned with fricationAmplitude=0.45 + parallel amp lift to be
    # audible-fricative rather than the old silent-approximant version that
    # caused the "entredado" inaudibility report. Word-initial /ɣ/ still
    # handled above (line ~196).
    - from: "ɣ"
      to: ɣ_es
    # More clear diphthong transition for /j/.
    - from: j
      to: j_es
    # In Spanish, ɪ and ʊ are diphthong glides (semivowels), not lax
    # vowels.  The _es variants have peripheral formants near cardinal
    # /i/ and /u/ (Quilis 1981, Martínez Celdrán).
    - from: "ɪ"
      to: "ɪ_es"
    - from: "ʊ"
      to: "ʊ_es"
    # Yeísmo (neutral):
    - from: "ʎ"
      to: "ʎ_es"
    # Proper sound for l:
    - from: l
      to: l_es
    # More reflection of nasals:
    - from: m
      to: m_es
    - from: n
      to: n_es
    # Castilian sound for /x/.
    - from: x
      to: x_es
    # A temporal workaround to get a /s/ sound with more brightness:
    - from: s
      to: s_es
    # Make ch more clear:
    - from: "t͡ʃ"
      to: "t͡ʃ_es"
    # Word-initial /r/: sonorant trill (no burst, voicing through closure).
    # Base /r/ has pa1-pa6 burst energy that makes it sound like /d/.
    - from: "r"
      to: "r_es"
      when:
        atWordStart: true
    # Non-initial /r/ as double-tap trill for words like "perro", "madre".
    - from: "r"
      to: "ɾᵊɾ"
